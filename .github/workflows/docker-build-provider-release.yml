# The release workflow of trajectory-labs-pbc/pulumi-docker-build. agent-c's
# infra/pulumi/docker_build_patch.py pins its releases; keep the test list below equal to PATCH_TESTS there.
name: Publish docker-build provider release

on:
  push:
    tags:
      - "v*-agent-c-*-go*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}

      # Go downloads the toolchain encoded in the tag when it differs from this bootstrap.
      - name: Install Go bootstrap
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.8"
          cache: false

      - name: Build and prove the tagged provider
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*-agent-c-????????????-go*) ;; *) echo "invalid provider release tag: $TAG" >&2; exit 1 ;; esac
          UPSTREAM_TAG="${TAG%%-agent-c-*}"
          PATCH_AND_TOOLCHAIN="${TAG#"$UPSTREAM_TAG-agent-c-"}"
          PATCH_SHORT="${PATCH_AND_TOOLCHAIN%%-go*}"
          GO_TOOLCHAIN="go${PATCH_AND_TOOLCHAIN##*-go}"
          test "$(git rev-parse --short=12 HEAD)" = "$PATCH_SHORT"
          ASSET="pulumi-resource-docker-build-${UPSTREAM_TAG}-${PATCH_SHORT}-linux-amd64.tar.gz"
          printf '%s\n' "TAG=$TAG" "UPSTREAM_TAG=$UPSTREAM_TAG" "PATCH_SHORT=$PATCH_SHORT" "ASSET=$ASSET" >> "$GITHUB_ENV"
          export GOTOOLCHAIN="$GO_TOOLCHAIN" GOFLAGS="" GOAMD64=v1 GOEXPERIMENT="" GOENV=off
          for test in TestHashIgnoresUmaskDerivedPermissions TestHashDockerfileErrorIsNotSwallowed TestHashFilemodeMatters TestDiffConfigProviderUpgradeIsNotAReplace TestDiffConfigHostChangeIsAReplace; do
            output="$(go test -count=1 -v -run "^${test}$" ./provider/internal/)"
            printf '%s\n' "$output"
            case "$output" in *"--- PASS: $test"*) ;; *) echo "$test did not run" >&2; exit 1 ;; esac
          done
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -buildvcs=false \
            -ldflags "-s -w -X github.com/pulumi/pulumi-docker-build/provider.Version=${UPSTREAM_TAG#v}" \
            -o pulumi-resource-docker-build ./provider/cmd/pulumi-resource-docker-build

      - name: Package deterministic release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - pulumi-resource-docker-build "$ASSET" <<'PY'
          import gzip, hashlib, io, pathlib, sys, tarfile
          binary, asset = map(pathlib.Path, sys.argv[1:])
          payload = binary.read_bytes()
          member = tarfile.TarInfo(binary.name)
          member.size, member.mode, member.mtime = len(payload), 0o755, 0
          member.uid = member.gid = 0
          member.uname = member.gname = ""
          with asset.open("wb") as raw:
              with gzip.GzipFile(filename="", mode="wb", fileobj=raw, mtime=0) as compressed:
                  with tarfile.open(fileobj=compressed, mode="w", format=tarfile.USTAR_FORMAT) as archive:
                      archive.addfile(member, io.BytesIO(payload))
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          asset.with_name(asset.name + ".sha256").write_text(f"{digest}  {asset.name}\n", encoding="utf-8")
          PY

      - name: Publish the GitHub release
        shell: bash
        env:
          # `gh` does not read github.token implicitly in Actions; without this every
          # invocation exits "set the GH_TOKEN environment variable".
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "docker-build provider ${UPSTREAM_TAG} + ${PATCH_SHORT}" \
            --notes "Built from the tagged patched provider with the Go toolchain encoded in the tag." \
            "$ASSET" "$ASSET.sha256"
